name: Fact accuracy gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:facts
      - run: npm run audit:facts
      - name: Ensure the committed audit is current
        run: git diff --exit-code -- docs/fact-accuracy-audit.md
