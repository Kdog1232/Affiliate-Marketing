name: Fact accuracy gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate:eslint-compatibility
      - run: npm run test:facts
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:facts
      - name: Ensure the committed audit is current
        run: git diff --exit-code -- docs/fact-accuracy-audit.md
